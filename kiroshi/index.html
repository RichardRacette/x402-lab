<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Kiroshi Optics Mk.1</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <header class="masthead">
      <div>
        <p class="eyebrow">NETRUNNER PERCEPTION LAYER // LOCAL ONLY</p>
        <h1>KIROSHI <span>OPTICS</span> <small>MK.1</small></h1>
      </div>
      <div class="pipeline" aria-label="Processing pipeline">
        <span>SENSOR</span><i></i><span>NORMALIZE</span><i></i><span>CORRELATE</span><i></i><span>RENDER</span>
      </div>
    </header>

    <main id="app" aria-live="polite">
      <section class="boot panel">
        <p class="eyebrow">OPTICAL LINK</p>
        <h2>Calibrating local sensors…</h2>
        <p>No external systems are being changed.</p>
      </section>
    </main>

    <footer>
      <span>BETTER EYES, NOT BIGGER WEAPONS</span>
      <span>READ-ONLY // AUTHORIZED EVIDENCE // NO EXECUTION PATH</span>
    </footer>
  </body>
</html>
