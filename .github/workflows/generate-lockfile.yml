name: Generate lockfile

on:
  push:
    branches: [repo-graduation-v1]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: generate package lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: repo-graduation-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deterministic dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate package lockfile"
          git push origin HEAD:repo-graduation-v1
